<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sources — GlobalNews</title><meta name="description" content="International publishers and feeds monitored by GlobalNews."><link rel="stylesheet" href="./css/variables.css?v=20261005-global"><link rel="stylesheet" href="./css/base.css?v=20261005-global"><style>.static-page{max-width:1100px;margin:0 auto;padding:3rem 1.5rem}.static-page h1{font-family:var(--font-serif);font-size:2.4rem}.sources-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-top:2rem}.source{padding:1rem;border:1px solid var(--border-light);border-radius:var(--radius-sm);background:var(--bg-surface)}.source h2{font-size:1rem;margin:0 0 .4rem}.source p{margin:.2rem 0;color:var(--text-muted);font-size:.85rem}.source a{color:var(--accent)}</style></head><body><main class="static-page"><a href="./">← Back to GlobalNews</a><h1>Publisher Sources</h1><p>GlobalNews uses publisher-provided RSS/Atom feeds where available. Inclusion is for discovery and attribution; it is not an endorsement of every report.</p><div id="sources" class="sources-grid">Loading source registry…</div></main><script>fetch(new URL("./data/sources.json",location.href),{cache:"no-store"}).then(r=>r.json()).then(s=>{document.getElementById("sources").innerHTML=s.map(x=>`<article class="source"><h2>${x.name}</h2><p>${x.region||"Global"} · ${x.country||""} · ${x.language||"en"}</p><p>${x.enabled?"Active feed":"Registry / inactive feed"}</p><a href="${x.website}" target="_blank" rel="noopener noreferrer">Publisher website ↗</a></article>`).join("")}).catch(()=>document.getElementById("sources").textContent="Source registry is temporarily unavailable.");</script></body></html>
