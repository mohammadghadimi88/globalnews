<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>GlobalNews — Redirecting</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Encodes path and query into hash route to preserve deep link state
      (function() {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        var newPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        var query = l.search ? l.search : '';
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#/' +
          newPath + query + l.hash
        );
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to GlobalNews terminal...</p>
  </body>
</html>
