name: Update Global News Pipeline

on:
  schedule:
    # Run every 15 minutes (UTC)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f collector/requirements.txt ]; then pip install -r collector/requirements.txt; fi

      - name: Run Feed Collector Pipeline
        run: |
          python collector/generate.py 48

      - name: Validate Generated News Data
        run: |
          python -c "import json; data = json.load(open('data/news.json')); assert isinstance(data, list) and len(data) > 0, 'news.json must be a non-empty list'; print(f'Validated {len(data)} news dispatches.')"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated news feed sync [skip ci]" && git push)
